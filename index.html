<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON REVENANT — Fortress Protocol</title>
<style>
:root{color-scheme:dark;--cyan:#64e8d4;--pink:#ff5b6e;--gold:#f4c96b;--green:#9fe870;--ink:#070b0d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:#edf5ef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer}
canvas{display:block;width:100%;height:100%;touch-action:none}
button:focus-visible{outline:3px solid white;outline-offset:4px}
button:disabled{opacity:.4;cursor:not-allowed}
#hud{position:fixed;inset:0 0 auto;padding:18px 23px;pointer-events:none;background:linear-gradient(#080c18f2,#080c1890,transparent)}
.hud-row,.stats{display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{font-size:11px;letter-spacing:3px;color:var(--cyan);font-weight:900}
.stats{gap:22px}
.stat{text-align:right}
.label{font-size:9px;font-weight:800;color:#9caccc;letter-spacing:1.8px}
.value{margin-top:3px;font-size:23px;font-weight:850;font-variant-numeric:tabular-nums}
.gold{color:var(--gold)}
.vitals{max-width:350px;margin-top:12px}
.bar-label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:1px;color:#c3d0e5;margin-bottom:4px}
.bar{height:8px;background:#172034;border:1px solid #29364d;border-radius:3px;overflow:hidden}
.fill{height:100%;transition:width .1s linear}
#hpFill{background:linear-gradient(90deg,#ff447c,#ff9c9c)}
#xpFill{background:linear-gradient(90deg,#39b9fc,#8effe8)}
.xp{height:5px;margin-top:8px}
#buildbar{position:fixed;bottom:17px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:22px 8px 8px;border:1px solid #38504d;background:#091211ee;border-radius:12px;box-shadow:0 10px 30px #0008}
#buildbar:before{content:"BUILD";position:absolute;top:6px;left:10px;font-size:8px;letter-spacing:2px;color:#7f9f99;font-weight:900}
#basebar:before{content:"CORE UPGRADES";position:absolute;top:6px;left:10px;font-size:8px;letter-spacing:2px;color:#89ad82;font-weight:900}
#basebar{position:fixed;bottom:98px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:22px 7px 7px;border:1px solid #526a4b;background:#0d1713ee;border-radius:10px;box-shadow:0 10px 30px #0007}
.base-button{min-width:104px;padding:8px 10px;border:1px solid #526a4b;border-radius:7px;background:#14231b;color:#dfffe8;font-size:10px;font-weight:800}.base-button small{display:block;margin-top:3px;color:#9fffaa;font-size:9px}.base-button:hover{border-color:#9fffaa}
.build-button{min-width:78px;padding:9px 10px;border:1px solid #34425c;border-radius:7px;background:#111c30;color:#dceaff}
.build-button strong{display:block;font-size:11px}
.build-button small{display:block;margin-top:4px;color:var(--gold);font-size:10px}
.build-button.selected{border-color:var(--cyan);background:#183b47;box-shadow:0 0 16px #71f6ff22}
.build-button:hover{border-color:var(--cyan)}
#tools{position:fixed;right:18px;bottom:21px;display:flex;gap:6px}
.tool,.secondary{padding:10px 13px;border:1px solid #41516e;border-radius:6px;background:#101b30;color:#d1ddf3;font-size:11px;font-weight:750}
.tool:hover,.secondary:hover{border-color:var(--cyan);color:var(--cyan)}
#loadout{position:fixed;left:20px;bottom:24px;display:flex;flex-wrap:wrap;gap:5px;max-width:calc(50% - 245px);pointer-events:none}
.chip{padding:5px 7px;border:1px solid #ffffff20;background:#0b1222d9;border-radius:4px;font-size:10px}
#toast{position:fixed;left:50%;top:143px;transform:translateX(-50%);width:min(90%,700px);text-align:center;color:var(--gold);font-size:12px;letter-spacing:2px;font-weight:850;pointer-events:none;opacity:0;transition:opacity .15s}
#placement{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);text-align:center;padding:10px 15px;background:#0a162aee;border:1px solid #71f6ff66;border-radius:8px;font-size:11px;display:none;max-width:95%}
#placement button{margin-left:10px;border:0;background:none;color:var(--pink);font-weight:800}
#overlay{position:fixed;inset:0;display:grid;place-items:center;padding:22px;overflow-y:auto;background:#030714c9;backdrop-filter:blur(8px)}
#overlay.hidden{display:none}
.panel{width:min(970px,100%);padding:30px;border:1px solid #53688765;border-radius:17px;background:linear-gradient(145deg,#172238fa,#090f1efa);box-shadow:0 28px 100px #0008,inset 0 1px #ffffff15;text-align:center}
.eyebrow{color:var(--cyan);font-size:10px;letter-spacing:3px;font-weight:850}
h1{font-size:clamp(35px,6vw,65px);line-height:.95;letter-spacing:-3px;margin:17px 0}
h1 span{color:var(--cyan)}
h2{font-size:31px;letter-spacing:-1px;margin:12px 0}
.sub{color:#aebed7;font-size:13px;line-height:1.65;max-width:650px;margin:0 auto 20px}
.primary{padding:14px 26px;border:0;border-radius:7px;color:#061321;background:var(--cyan);font-weight:900;letter-spacing:1.5px;box-shadow:0 0 30px #71f6ff22}
.primary:hover{background:#c0fcff}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.controls{font-size:11px;color:#92a5c2;line-height:1.9;margin-top:18px}
kbd{padding:1px 5px;border:1px solid #52617b;border-bottom-width:3px;border-radius:4px;font:10px monospace;color:#e4edff}
.frames,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}
.frame,.card,.trait{text-align:left;padding:18px;border:1px solid #425474;border-radius:9px;background:#0a1225;color:#e8f2ff}
.frame{transition:border-color .12s,background .12s}
.frame.selected{border-color:var(--cyan);background:#123040}
.frame:hover,.card:hover{border-color:var(--accent,var(--cyan));background:#18283f}
.frame strong,.card-title,.trait strong{display:block;font-size:16px;margin-bottom:7px}
.frame p,.card-desc,.trait p{margin:0;font-size:12px;line-height:1.6;color:#aebed7}
.card{min-height:210px;transition:transform .18s,box-shadow .18s;animation:cardIn .28s ease both}.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}
.card:hover{transform:translateY(-7px) scale(1.015);box-shadow:0 14px 35px #0008}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
#overlay.upgrade-mode{background:#020807dc;backdrop-filter:blur(10px)}
#overlay.upgrade-mode .panel{border-color:#64e8d477;box-shadow:0 30px 120px #000b,0 0 55px #64e8d412}
.card-icon{font-size:29px;color:var(--accent);margin-bottom:13px}
.card-rank{display:flex;justify-content:space-between;margin-top:15px;color:var(--accent);font-size:10px;letter-spacing:1px}
.workshop{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.trait .purchase{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.rank-dots{letter-spacing:3px;font-size:12px;color:var(--cyan)}
.results{display:flex;justify-content:center;flex-wrap:wrap;gap:26px;margin:25px 0}
.result strong{display:block;color:var(--cyan);font-size:27px;margin-top:6px}
.scrap-balance{font-size:15px;color:var(--gold);font-weight:800;margin:13px 0}
.reels{display:flex;justify-content:center;gap:12px;margin:28px auto}
.reel{display:grid;place-items:center;width:105px;height:112px;border:2px solid #71f6ff80;border-radius:12px;background:#060c1b;color:var(--cyan);font-weight:900;font-size:42px;box-shadow:inset 0 0 30px #71f6ff11,0 0 25px #71f6ff11}
.reel.locked{color:var(--gold);border-color:var(--gold)}
.notice{font-size:11px;color:#8ca0c0}
@media(max-width:950px){
 #loadout{bottom:112px;max-width:65%;left:14px}
 #tools{bottom:116px;right:12px}
}
@media(max-width:650px){
 #hud{padding:12px}.brand{font-size:9px;letter-spacing:1px}.stats{gap:12px}.value{font-size:18px}.label{font-size:8px}
 .vitals{max-width:235px}.panel{padding:22px 15px}.frames,.cards{grid-template-columns:1fr;gap:8px}
 .frame,.card{padding:12px 14px;min-height:0}.frame p{font-size:11px}.card-icon{float:left;margin:0 13px 0 0;font-size:24px}
 .card-rank{margin-top:8px}.workshop{grid-template-columns:1fr}
 #buildbar{bottom:12px;gap:4px;padding:6px}.build-button{min-width:65px;padding:9px 7px}
 .build-button strong{font-size:10px}#loadout{bottom:98px;max-width:62%}#tools{bottom:99px}
 #placement{bottom:175px;width:94%}#toast{top:130px;font-size:10px}.results{gap:18px}.result strong{font-size:23px}
 .reel{width:78px;height:92px}
}
</style>

<body>
<canvas id="arena" aria-label="Neon Revenant horde survival arena"></canvas>

<div id="hud">
 <div class="hud-row">
  <div class="brand">NEON / REVENANT<br><span style="color:#6f829f;letter-spacing:1px;font-size:9px">FORTRESS PROTOCOL</span></div>
  <div class="stats">
   <div class="stat"><div class="label">SURVIVE</div><div class="value gold" id="clock">00:00</div></div>
   <div class="stat"><div class="label">SLAIN</div><div class="value" id="kills">0</div></div>
   <div class="stat"><div class="label">LEVEL</div><div class="value" id="level">1</div></div>
   <div class="stat"><div class="label">SCRAP</div><div class="value gold" id="scrap">0</div></div>
   <div class="stat"><div class="label">SUPPLY</div><div class="value" style="color:#9fe870" id="supplyHud">0</div></div>
  </div>
 </div>
 <div class="vitals">
  <div class="bar-label"><span id="frameLabel">INTEGRITY</span><span id="hpText">100 / 100</span></div>
  <div class="bar"><div class="fill" id="hpFill" style="width:100%"></div></div>
  <div class="bar xp"><div class="fill" id="xpFill" style="width:0%"></div></div>
 </div>
</div>
<div id="versionTag" style="position:fixed;left:10px;bottom:8px;z-index:9;color:#70857a;font:800 10px/1 system-ui;letter-spacing:1px;pointer-events:none">v0.6.0 · SIEGE PROTOCOL</div>

<div id="loadout"></div>
<div id="toast" role="status"></div>
<div id="placement"><span id="placementText"></span><button id="cancelBuild">CANCEL</button></div>

<div id="basebar">
 <button class="base-button" data-base-upgrade="damage">ARMORY <kbd>8</kbd><small id="damageUpgradeText">+TURRET DMG · 6 SUPPLY</small></button>
 <button class="base-button" data-base-upgrade="fire">AUTOLOADER <kbd>9</kbd><small id="fireUpgradeText">+FIRE RATE · 6 SUPPLY</small></button>
 <button class="base-button" data-base-upgrade="core">CORE EXPAND <kbd>0</kbd><small id="coreUpgradeText">+HP / BUILD RANGE · 8 SUPPLY</small></button>
</div>
<div id="buildbar">
 <button class="build-button" data-build="0"><strong>TURRET <kbd>4</kbd></strong><small>35 SCRAP</small></button>
 <button class="build-button" data-build="1"><strong>SIPHON <kbd>5</kbd></strong><small>50 SCRAP</small></button>
 <button class="build-button" data-build="2"><strong>WALL LINE <kbd>6</kbd></strong><small>1 SUPPLY / SECTION</small></button>
 <button class="build-button" data-build="3"><strong>REPAIR <kbd>7</kbd></strong><small>45 SCRAP</small></button>
</div>

<div id="tools">
 <button class="tool" id="soundButton" aria-label="Toggle sound">SOUND ON</button>
 <button class="tool" id="pauseButton">PAUSE · P</button>
</div>

<div id="overlay" role="dialog" aria-modal="true" aria-label="Game menu">
 <div class="panel" id="panel"></div>
</div>

<script>
"use strict";
(() => {
 const $ = id => document.getElementById(id);
 const canvas = $("arena");
 const ctx = canvas.getContext("2d", { alpha: false });
 const overlay = $("overlay");
 const panel = $("panel");
 const TAU = Math.PI * 2;
 const RUN_LENGTH = 900;
 const BUILD_VERSION = "v0.6.0 · SIEGE PROTOCOL";
 const SAVE_KEY = "neon-revenant-fortress-v1";
 const rand = (a,b) => a + Math.random() * (b-a);
 const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
 const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
 const fmt = t => String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0");

 const traits = [
  {name:"Overclock",base:50,exponent:1.6,icon:"ϟ",description:"+6% weapon damage per rank."},
  {name:"Thrusters",base:40,exponent:1.5,icon:"»",description:"+5% base movement speed per rank."},
  {name:"Plating",base:35,exponent:1.4,icon:"◈",description:"+10 max HP and +0.2 HP/sec regeneration per rank."},
  {name:"Scavenger",base:60,exponent:1.7,icon:"⬡",description:"+10% enemy Scrap yield per rank."}
 ];
 const frames = [
  {name:"Engineer",description:"Free starting turret. +30% structure HP. Building costs reduced by 20%."},
  {name:"Blademaster",description:"Starts with Orbiting Shield. +30% orbital rotation speed. Bolt cooldown is 15% longer."},
  {name:"Raider",description:"+20% base movement speed. +30% enemy Scrap yield. Starts with 25 less max HP."}
 ];
 const buildTypes = [
  {name:"Kinetic Turret",short:"TURRET",cost:35,hp:130,radius:21,color:"#71f6ff"},
  {name:"Energy Siphon",short:"SIPHON",cost:50,hp:90,radius:22,color:"#ffb86f"},
  {name:"Nanite Barricade",short:"WALL",cost:15,hp:320,radius:28,color:"#c1a1ff"},
  {name:"Repair Pylon",short:"REPAIR",cost:45,hp:110,radius:20,color:"#8effb6"},
  {name:"Command Core",short:"CORE",cost:0,hp:900,radius:38,color:"#9fffaa"}
 ];

 let meta = {scrap:0,carry:0,ranks:[0,0,0,0],frame:0,best:0};
 try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
  if(saved && typeof saved === "object") {
   const finite = (v, fallback=0) => Number.isFinite(Number(v)) ? Number(v) : fallback;
   meta.scrap = Math.floor(clamp(finite(saved.scrap),0,1e12));
   meta.carry = clamp(finite(saved.carry),0,.999999);
   meta.ranks = traits.map((_,i) => Math.floor(clamp(finite(saved.ranks?.[i]),0,10)));
   meta.frame = Math.floor(clamp(finite(saved.frame),0,2));
   meta.best = clamp(finite(saved.best),0,RUN_LENGTH);
  }
 } catch (_) {}
 let dirty = false, saveClock = 0;
 function save() {
  try {localStorage.setItem(SAVE_KEY,JSON.stringify(meta));dirty=false;} catch (_) {}
 }
 window.addEventListener("pagehide",save);

 // Active objects use swap removal; freed objects are reused.
 class Pool {
  constructor(capacity) {
   this.active = [];
   this.free = Array.from({length:capacity},()=>({}));
  }
  spawn(values) {
   if(!this.free.length) return null;
   const object = this.free.pop();
   Object.assign(object,values);
   this.active.push(object);
   return object;
  }
  remove(index) {
   const object = this.active[index];
   this.active[index] = this.active[this.active.length-1];
   this.active.pop();
   this.free.push(object);
  }
  clear() {
   while(this.active.length) this.free.push(this.active.pop());
  }
 }
 const enemies = new Pool(540);
 const structures = new Pool(80);
 const projectiles = new Pool(1100);
 const particles = new Pool(1800);
 const numbers = new Pool(220);
 const pickups = new Pool(1800);
 const caches = new Pool(16);
 const effects = new Pool(180);
 const pools = [enemies,structures,projectiles,particles,numbers,pickups,caches,effects];

 // Enemies and structures share one spatial-hashing service.
 // Buckets themselves are also recycled to reduce garbage collection.
 class SpatialGrid {
  constructor(size) {
   this.size=size;
   this.cells=new Map();
   this.free=[];
  }
  clear() {
   for(const bucket of this.cells.values()) {
    bucket.enemies.length=0;
    bucket.structures.length=0;
    this.free.push(bucket);
   }
   this.cells.clear();
  }
  insert(object,kind) {
   const key=Math.floor(object.x/this.size)+","+Math.floor(object.y/this.size);
   let bucket=this.cells.get(key);
   if(!bucket) {
    bucket=this.free.pop() || {enemies:[],structures:[]};
    this.cells.set(key,bucket);
   }
   bucket[kind].push(object);
  }
  rebuild() {
   this.clear();
   for(const e of enemies.active) if(!e.dead) this.insert(e,"enemies");
   for(const s of structures.active) if(!s.dead) this.insert(s,"structures");
  }
  query(x,y,radius,kind,callback) {
   const x0=Math.floor((x-radius)/this.size), x1=Math.floor((x+radius)/this.size);
   const y0=Math.floor((y-radius)/this.size), y1=Math.floor((y+radius)/this.size);
   for(let xCell=x0;xCell<=x1;xCell++) {
    for(let yCell=y0;yCell<=y1;yCell++) {
     const bucket=this.cells.get(xCell+","+yCell);
     if(bucket) for(const object of bucket[kind]) if(!object.dead) callback(object);
    }
   }
  }
 }
 const grid=new SpatialGrid(90);

 const audio={
  ctx:null,master:null,noise:null,muted:false,last:Object.create(null),
  gemTime:-100,gemStep:0,
  init() {
   if(!this.ctx) {
    const A=window.AudioContext || window.webkitAudioContext;
    if(!A) return;
    try {
     this.ctx=new A();
     this.master=this.ctx.createGain();
     this.master.gain.value=this.muted ? 0 : .23;
     this.master.connect(this.ctx.destination);
     this.noise=this.ctx.createBuffer(1,Math.floor(this.ctx.sampleRate*.4),this.ctx.sampleRate);
     const data=this.noise.getChannelData(0);
     for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
    } catch (_) {return;}
   }
   if(this.ctx?.state==="suspended") this.ctx.resume().catch(()=>{});
  },
  tone(f,end,duration,type="square",volume=.12,delay=0) {
   if(!this.ctx || this.muted) return;
   const now=this.ctx.currentTime+delay;
   const oscillator=this.ctx.createOscillator(), gain=this.ctx.createGain();
   oscillator.type=type;
   oscillator.frequency.setValueAtTime(Math.max(20,f),now);
   oscillator.frequency.exponentialRampToValueAtTime(Math.max(20,end),now+duration);
   gain.gain.setValueAtTime(volume,now);
   gain.gain.exponentialRampToValueAtTime(.001,now+duration);
   oscillator.connect(gain);gain.connect(this.master);
   oscillator.start(now);oscillator.stop(now+duration+.02);
  },
  hiss(duration,volume,frequency) {
   if(!this.ctx || this.muted || !this.noise) return;
   const now=this.ctx.currentTime;
   const source=this.ctx.createBufferSource(),filter=this.ctx.createBiquadFilter(),gain=this.ctx.createGain();
   source.buffer=this.noise;filter.type="lowpass";filter.frequency.value=frequency;
   gain.gain.setValueAtTime(volume,now);
   gain.gain.exponentialRampToValueAtTime(.001,now+duration);
   source.connect(filter);filter.connect(gain);gain.connect(this.master);
   source.start(now);source.stop(now+duration);
  },
  play(name) {
   if(!this.ctx || this.muted) return;
   const now=this.ctx.currentTime;
   const cooldown={shot:.06,hit:.055,crit:.075,scrap:.08,gem:.03}[name] || 0;
   if(now-(this.last[name] ?? -100)<cooldown) return;
   this.last[name]=now;
   if(name==="shot") this.tone(850,170,.07,"square",.055);
   if(name==="hit"){this.tone(160,55,.055,"triangle",.1);this.hiss(.04,.05,1400);}
   if(name==="hurt"){this.tone(130,28,.25,"sawtooth",.2);this.hiss(.15,.15,800);}
   if(name==="crit"){this.tone(105,34,.17,"sine",.36);this.tone(620,260,.06,"square",.08);}
   if(name==="scrap") this.tone(500,710,.06,"triangle",.075);
   if(name==="gem") {
    const gap=now-this.gemTime;
    if(gap>=.5) this.gemStep=0;
    else if(gap<=.25) this.gemStep=Math.min(24,this.gemStep+1);
    this.gemTime=now;
    const f=880*Math.pow(2,this.gemStep/12);
    this.tone(f,f*1.12,.085,"sine",.11);
   }
   if(name==="level") [440,554,659,880].forEach((f,i)=>this.tone(f,f,.22,"square",.09,i*.075));
   if(name==="frost"){this.hiss(.22,.12,6000);this.tone(1400,200,.3,"triangle",.1);}
   if(name==="chain") this.tone(1800,65,.15,"sawtooth",.085);
   if(name==="build"){this.tone(220,440,.13,"triangle",.16);this.tone(660,880,.12,"square",.075,.09);}
   if(name==="repair") this.tone(450,850,.18,"sine",.075);
   if(name==="boss" || name==="nuke"){this.tone(90,25,.65,"sawtooth",.25);this.hiss(.35,.2,900);}
   if(name==="slot") this.tone(650,900,.035,"square",.06);
   if(name==="jackpot" || name==="victory") [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,f,.35,"triangle",.17,i*.12));
  }
 };

 let W=1200,H=760,scale=1,dpr=1,state="menu";
 let time=0,visualTime=0,kills=0,level=1,xp=0,xpGoal=24;
 let spawnTimer=0,nextBoss=60,shootTimer=0,chainTimer=2,frostTimer=3,laserTimer=0;
 let rotor=0,aimAngle=0,shake=0,flash=0,chronos=0,toastTimer=0,hudTimer=0;
 let runEarned=0,runSpent=0,entityId=0,lastFrame=0;
 let carriedSupply=0,bankedSupply=0,supplyTimer=4,baseDamageRank=0,baseFireRank=0,coreRank=0,commandCore=null;

 function updateSlot(dt) {
  slot.elapsed+=dt;
  const tick=Math.floor(slot.elapsed/.055);
  if(tick!==slot.lastTick) {
   slot.lastTick=tick;
   const symbols=["✦","ϟ","⬡","◈","★"];
   for(let i=0;i<3;i++) {
    const reel=$("reel"+i);
    if(reel) reel.textContent=symbols[(tick+i*2)%symbols.length];
   }
   audio.play("slot");
  }
  if(slot.elapsed<.8) return;
  const reward=slot.tier===1 ? 40 : slot.tier===3 ? 120 : 300;
  gainScrap(reward);
  freeChoices=slot.tier===1 ? 1 : slot.tier===3 ? 2 : 3;
  if(slot.tier===3) player.hp=player.maxHp;
  state="playing";
  if(slot.tier===5) screenClear(false);
  audio.play("jackpot");save();updateHud();
  toast(`${slot.tier}× ${slot.tier===1 ? "JACKPOT" : slot.tier===3 ? "SUPER JACKPOT" : "MEGA JACKPOT"} // +${reward} SCRAP`,4);
  openChoices("cache");
 }

 function updateEnemies(dt) {

   e.hit=Math.max(0,e.hit-dt);

   e.freeze=Math.max(0,e.freeze-dt);

   const target=(commandCore&&!commandCore.dead&&(assaultPhase==="assault"||e.type===3||dist(e,commandCore)<360))?commandCore:player;
   const dx=target.x-e.x,dy=target.y-e.y,d=Math.hypot(dx,dy)||1;const angle=Math.atan2(dy,dx);

 function updateProjectiles(dt,blades) {
  for(let i=projectiles.active.length-1;i>=0;i--) {
   const b=projectiles.active[i];
   if(b.hostile && chronos>0) continue;
   const ox=b.x,oy=b.y;
   b.life-=dt;
   if(b.homing) {
    const angle=Math.atan2(player.y-b.y,player.x-b.x),speed=Math.hypot(b.vx,b.vy);
    const steering=1-Math.exp(-1.6*dt);
    b.vx+=(Math.cos(angle)*speed-b.vx)*steering;
    b.vy+=(Math.sin(angle)*speed-b.vy)*steering;
   }
   b.x+=b.vx*dt;b.y+=b.vy*dt;
   let remove=b.life<=0;
   if(!remove && b.hostile) {
    for(const blade of blades) {
     if(segmentDistanceSquared(ox,oy,b.x,b.y,blade.x,blade.y)<(b.radius+15)**2) {
      remove=true;burst(b.x,b.y,"#c1a1ff",4,60);break;
     }
    }
    if(!remove) {
     let hitStructure=null,best=Infinity;
     grid.query((ox+b.x)/2,(oy+b.y)/2,Math.hypot(b.x-ox,b.y-oy)/2+45,"structures",s=>{
      if(segmentDistanceSquared(ox,oy,b.x,b.y,s.x,s.y)<(b.radius+s.radius)**2) {
       const d=(s.x-ox)**2+(s.y-oy)**2;
       if(d<best){best=d;hitStructure=s;}
      }
     });
     if(hitStructure) {
      const attacker=enemies.active.find(e=>!e.dead && e.id===b.ownerId) || null;
      damageStructure(hitStructure,b.damage,attacker);remove=true;
      burst(b.x,b.y,"#ff7290",4,70);
     }
    }
    if(!remove && segmentDistanceSquared(ox,oy,b.x,b.y,player.x,player.y)<(b.radius+player.radius)**2) {
     hurt(b.damage,b.x,b.y);remove=true;
    }
   } else if(!remove) {
    let first=null,best=Infinity;
    const radius=Math.hypot(b.x-ox,b.y-oy)/2+50;
    grid.query((ox+b.x)/2,(oy+b.y)/2,radius,"enemies",e=>{
     if(b.hitIds.has(e.id)) return;
     if(segmentDistanceSquared(ox,oy,b.x,b.y,e.x,e.y)<(b.radius+e.radius)**2) {
      if(b.rail) {
       b.hitIds.add(e.id);strike(e,b.damage,b.color);burst(e.x,e.y,"#71f6ff",3,70);
      } else {
       const d=(e.x-ox)*b.vx+(e.y-oy)*b.vy;
       if(d<best){best=d;first=e;}
      }
     }
    });
    if(first) {strike(first,b.damage,b.color);burst(b.x,b.y,"#71f6ff",3,60);remove=true;}
   }
   if(remove) projectiles.remove(i);
   if(state!=="playing") return;
  }
 }

    chainTimer=Math.max(.8,3.8*Math.pow(.88,ranks[2]-1));

   if(p.kind==="xp") ctx.fillRect(-p.size*pulse/2,-p.size*pulse/2,p.size*pulse,p.size*pulse);
   else {polygon(p.size*pulse,6);ctx.fill();circle(0,0,2,"#342a20");}
  } else {
   const color=p.kind==="supply" ? "#9fffaa" : p.kind==="nuke" ? "#ff688b" : p.kind==="chrono" ? "#71f6ff" : "#ffdc82";

   polygon(15,6,visualTime*.4);ctx.fillStyle="#102137";ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
   ctx.fillStyle=color;ctx.font="bold 19px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
   ctx.fillText(p.kind==="supply" ? "S" : p.kind==="nuke" ? "✹" : p.kind==="chrono" ? "Ⅱ" : "◎",0,0);
  }
  ctx.restore();
 }
 function cacheArt(c) {

  circle(0,0,29+Math.sin(visualTime*4+c.phase)*3,"#ffdc8215","#ffdc8277",1.5);
  ctx.rotate(Math.PI/4);
  ctx.fillStyle="#28314a";ctx.fillRect(-14,-14,28,28);
  ctx.strokeStyle="#ffdc82";ctx.lineWidth=2;ctx.strokeRect(-14,-14,28,28);
  ctx.fillStyle="#ffdc82";ctx.fillRect(-5,-5,10,10);
  ctx.restore();
  ctx.textAlign="center";ctx.fillStyle="#ffdc82";ctx.font="bold 9px system-ui";ctx.fillText("CORE CACHE",c.x,c.y-37);
 }
 function playerArt() {
  const count=bladeCount();
  if(count) {
   circle(player.x,player.y,59+Math.min(ranks[1],8)*2,null,"#c1a1ff23");
   for(let i=0;i<count;i++) {
    const b=bladePosition(i,count);
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle+Math.PI/2);
    ctx.fillStyle="#c1a1ff22";ctx.fillRect(-8,-23,16,46);
    ctx.beginPath();ctx.moveTo(0,-19);ctx.lineTo(6,1);ctx.lineTo(0,17);ctx.lineTo(-6,-1);ctx.closePath();
    ctx.fillStyle="#dfcfff";ctx.fill();ctx.strokeStyle="#ae80ff";ctx.lineWidth=2;ctx.stroke();ctx.restore();
   }
  }
  ctx.save();ctx.translate(player.x,player.y);
  if(player.invincible>0 && Math.floor(player.invincible*18)%2) ctx.globalAlpha=.45;
  const color=classId===1 ? "#c1a1ff" : classId===2 ? "#ffb86f" : "#71f6ff";
  circle(0,5,18,"#0008");circle(0,0,25,color+"0c");circle(0,0,20,null,color+"44");
  ctx.rotate(aimAngle);
  ctx.fillStyle="#243f57";ctx.fillRect(-10,-11,18,22);
  ctx.fillStyle=color;ctx.fillRect(-5,-13,7,4);ctx.fillRect(-5,9,7,4);
  polygon(13,6,Math.PI/6);ctx.fillStyle="#122636";ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle="#d8ffff";ctx.fillRect(3,-7,4,14);
  ctx.fillStyle="#41657a";ctx.fillRect(8,-4,15,8);ctx.fillStyle=color;ctx.fillRect(20,-3,5,6);
  ctx.restore();
  if(player.invincible>0) circle(player.x,player.y,29,null,"#ff7ea766",2);
 }
 function effectArt() {
  for(const e of effects.active) {
   const alpha=e.life/e.maxLife;ctx.globalAlpha=alpha;
   if(e.type==="ring") {
    const radius=e.end*(1-alpha*alpha);
    circle(e.x,e.y,radius,e.color+"0c",e.color,3*alpha+1);
    circle(e.x,e.y,radius*.86,null,e.color+"66");
   } else {
    for(let layer=0;layer<2;layer++) {
     ctx.beginPath();ctx.moveTo(e.points[0].x,e.points[0].y);
     for(let i=1;i<e.points.length;i++) {
      const a=e.points[i-1],b=e.points[i],angle=Math.atan2(b.y-a.y,b.x-a.x)+Math.PI/2;
      for(let j=1;j<=7;j++) {
       const t=j/7,wobble=j===7 ? 0 : Math.sin(e.seed+j*9+i*4)*13;
       ctx.lineTo(a.x+(b.x-a.x)*t+Math.cos(angle)*wobble,a.y+(b.y-a.y)*t+Math.sin(angle)*wobble);
      }
     }
     ctx.strokeStyle=layer ? "#fffce5" : "#ffdc8255";ctx.lineWidth=layer ? 2 : 8;ctx.stroke();
    }
   }
  }
  ctx.globalAlpha=1;
 }
 function drawLaserLinks() {
  if(!evolved[0]) return;
  const turrets=structures.active.filter(s=>!s.dead && s.type===0);
  ctx.lineWidth=7;ctx.strokeStyle="#71f6ff15";ctx.beginPath();
  for(let i=0;i<turrets.length;i++) for(let j=i+1;j<turrets.length;j++) {
   ctx.moveTo(turrets[i].x,turrets[i].y);ctx.lineTo(turrets[j].x,turrets[j].y);
  }
  ctx.stroke();ctx.lineWidth=1.5;ctx.strokeStyle="#b7ffff88";ctx.stroke();
 }
 function drawBlueprint() {
  if(blueprint<0 || state!=="playing") return;
  const p=mouseWorld(),valid=placementValid(blueprint,p.x,p.y),b=buildTypes[blueprint];
  if(blueprint===2 && wallLineStart){
   const pts=wallLinePoints(wallLineStart,p),price=cost(2)*pts.length;
   ctx.save();ctx.globalAlpha=.75;ctx.strokeStyle=bankedSupply>=price?"#c1a1ff":"#ff5b6e";ctx.lineWidth=8;ctx.setLineDash([12,7]);ctx.beginPath();ctx.moveTo(wallLineStart.x,wallLineStart.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.setLineDash([]);
   for(const q of pts) circle(q.x,q.y,10,bankedSupply>=price?"#c1a1ff33":"#ff5b6e33",bankedSupply>=price?"#d9c6ff":"#ff8a98",1.5);
   ctx.fillStyle=bankedSupply>=price?"#e8ddff":"#ff9daa";ctx.font="bold 11px system-ui";ctx.textAlign="center";ctx.fillText(pts.length+" SECTIONS · "+price+" SUPPLY",p.x,p.y-28);ctx.restore();return;
  }
  circle(player.x,player.y,PLACE_RANGE+coreRank*45,"#71f6ff04","#71f6ff44");
  ctx.save();ctx.globalAlpha=.7;
  circle(p.x,p.y,b.radius+13,valid ? "#71f6ff15" : "#ff548b22",valid ? "#71f6ff" : "#ff548b",2);
  ctx.setLineDash([5,5]);
  if(blueprint===0) circle(p.x,p.y,340,null,"#71f6ff33");
  if(blueprint===1) circle(p.x,p.y,145,null,"#ffb86f55");
  if(blueprint===3) circle(p.x,p.y,220,null,"#8effb655");
  ctx.setLineDash([]);
  structureArt({x:p.x,y:p.y,type:blueprint,radius:b.radius,color:valid ? b.color : "#ff548b",
   hp:1,maxHp:1,aim:aimAngle,flash:0},true);
  ctx.restore();
  ctx.fillStyle=valid ? "#aaffee" : "#ff8ba9";ctx.textAlign="center";ctx.font="bold 10px system-ui";
  ctx.fillText(valid ? "PLACE · "+cost(blueprint)+" SUPPLY" : "BLOCKED / COST / CAP",p.x,p.y-b.radius-23);
 }
 function drawResourceSites(){for(const s of resourceSites){if(!visible(s.x,s.y,70))continue;ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.phase*.25);circle(0,0,30,"#13231a","#9fe87088",2);polygon(18,6,Math.PI/6);ctx.fillStyle=s.stock>0?"#9fe87033":"#273329";ctx.fill();ctx.strokeStyle=s.stock>0?"#b9ff91":"#56645b";ctx.stroke();ctx.rotate(-s.phase*.25);ctx.fillStyle=s.stock>0?"#d8ffc6":"#7d8b82";ctx.font="900 10px system-ui";ctx.textAlign="center";ctx.fillText(s.stock>0?"SUPPLY "+s.stock:(s.cooldown>0?"RESTOCK "+Math.ceil(s.cooldown)+"s":"RESTOCKING"),0,4);ctx.restore();}}
 function drawPhaseHud(){if(state!=="playing")return;ctx.save();ctx.textAlign="center";const d=assaultPhase==="warning"||assaultPhase==="assault",tl=threatLevel(),rating=tl<30?"LOW":tl<65?"RISING":tl<110?"HIGH":tl<165?"SEVERE":"EXTREME";let top;if(assaultPhase==="assault"){const alive=enemies.active.reduce((n,e)=>n+(!e.dead?1:0),0),remaining=Math.max(0,(waveBudget-waveSpawned)+alive);top="WAVE "+assaultNumber+"  ·  "+remaining+" HOSTILES REMAINING";}else if(assaultPhase==="warning")top="⚠  WAVE "+(assaultNumber+1)+" INCOMING  ·  "+Math.max(0,Math.ceil(phaseTimer))+"s  ⚠";else top=(assaultPhase==="recovery"?"RECOVERY":"SCAVENGE")+"  ·  "+Math.max(0,Math.ceil(phaseTimer))+"s";const boxW=Math.min(720,W*.72),boxH=d?74:60,x=W/2-boxW/2,y=70;ctx.fillStyle=d?"rgba(35,4,10,.94)":"rgba(5,18,13,.90)";ctx.strokeStyle=d?"#ff526b":"#64e8d4";ctx.lineWidth=d?3:2;ctx.fillRect(x,y,boxW,boxH);ctx.strokeRect(x,y,boxW,boxH);ctx.shadowColor=d?"#ff526b":"#64e8d4";ctx.shadowBlur=d?18:8;ctx.fillStyle=d?"#fff0f2":"#effff5";ctx.font=d?"1000 24px system-ui":"1000 20px system-ui";ctx.fillText(top,W/2,y+31);ctx.shadowBlur=0;ctx.font="900 12px system-ui";ctx.fillStyle=rating==="EXTREME"?"#ff526b":rating==="SEVERE"?"#ff9a67":"#bfffcf";ctx.fillText("THREAT "+rating+"  ·  "+Math.floor(tl)+(assaultPhase==="warning"?"  ·  "+(waveFronts.length>1?"MULTIPLE FRONTS":directionName(assaultAngle)):""),W/2,y+53);ctx.restore();}
 function draw() {
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);floor();
  ctx.save();
  ctx.translate(W/2-camera.x+(shake ? rand(-shake,shake) : 0),H/2-camera.y+(shake ? rand(-shake,shake) : 0));
  drawLaserLinks();drawResourceSites();
  for(const p of pickups.active) pickupArt(p);
  for(const c of caches.active) cacheArt(c);
  for(const s of structures.active) if(!s.dead && visible(s.x,s.y,50)) structureArt(s);
  for(const e of enemies.active) enemyArt(e);
  for(const b of projectiles.active) {
   if(!visible(b.x,b.y,35)) continue;
   if(b.hostile) {
    circle(b.x,b.y,b.radius+6,chronos>0 ? "#71f6ff18" : "#ff4d641c");
    circle(b.x,b.y,b.radius,chronos>0 ? "#386782" : "#be2c4f",chronos>0 ? "#b5efff" : "#ff667e",1.5);
    circle(b.x-1,b.y-1,b.radius*.38,"#ffd1d9");
   } else {
    const angle=Math.atan2(b.vy,b.vx),length=b.rail ? 85 : 19;
    ctx.strokeStyle=b.rail ? "#71f6ff44" : "#71f6ff33";ctx.lineWidth=b.rail ? 10 : 7;
    ctx.beginPath();ctx.moveTo(b.x-Math.cos(angle)*length,b.y-Math.sin(angle)*length);ctx.lineTo(b.x,b.y);ctx.stroke();
    ctx.strokeStyle="#e2ffff";ctx.lineWidth=b.rail ? 3.5 : 3;
    ctx.beginPath();ctx.moveTo(b.x-Math.cos(angle)*length*.85,b.y-Math.sin(angle)*length*.85);ctx.lineTo(b.x,b.y);ctx.stroke();
   }
  }
  playerArt();effectArt();
  for(const p of particles.active) {
   if(!visible(p.x,p.y,20)) continue;
   ctx.globalAlpha=p.life/p.maxLife;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
   ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);ctx.restore();
  }
  ctx.globalAlpha=1;ctx.textAlign="center";
  for(const n of numbers.active) {
   ctx.globalAlpha=Math.min(1,n.life*3);ctx.font=`850 ${n.big ? 22 : 12}px system-ui`;
   ctx.lineWidth=3;ctx.strokeStyle="#080d1a";ctx.strokeText(n.text,n.x,n.y);
   if(n.big){ctx.shadowColor=n.color;ctx.shadowBlur=9;}
   ctx.fillStyle=n.color;ctx.fillText(n.text,n.x,n.y);ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;drawBlueprint();ctx.restore();drawPhaseHud();

  // Powered construction perimeter
  if(state==="playing"&&commandCore&&!commandCore.dead){ctx.save();ctx.translate(W/2-camera.x,H/2-camera.y);ctx.setLineDash([8,10]);ctx.strokeStyle="#9fe87055";ctx.lineWidth=2;ctx.beginPath();ctx.arc(commandCore.x,commandCore.y,235+coreRank*55,0,TAU);ctx.stroke();ctx.restore();}
  const vignette=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.25,W/2,H/2,Math.max(W,H)*.65);
  vignette.addColorStop(0,"rgba(0,0,0,0)");vignette.addColorStop(1,"rgba(2,5,14,.65)");
  ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
  if(flash>0){ctx.fillStyle=`rgba(255,55,100,${flash*.55})`;ctx.fillRect(0,0,W,H);}
  if(chronos>0 && state==="playing") {
   ctx.strokeStyle="#71f6ff88";ctx.lineWidth=5;ctx.strokeRect(3,3,W-6,H-6);
   ctx.font="bold 12px system-ui";ctx.textAlign="center";ctx.fillStyle="#a8efff";
   ctx.fillText("CHRONOS "+chronos.toFixed(1)+"s",W/2,194);
  }
  if(state==="playing") {
   const indicators=[];
   if(commandCore&&!commandCore.dead&&!visible(commandCore.x,commandCore.y,-20)) indicators.push({x:commandCore.x,y:commandCore.y,color:"#9fe870",label:"CORE"});
   for(const p of pickups.active) if(p.kind==="supply"&&!visible(p.x,p.y,-20)) indicators.push({x:p.x,y:p.y,color:"#9fe870",label:"SUPPLY"});
   for(const it of indicators.slice(0,4)){const a=Math.atan2(it.y-camera.y,it.x-camera.x),co=Math.cos(a),si=Math.sin(a),rr=Math.min((W/2-48)/Math.max(.001,Math.abs(co)),(H/2-62)/Math.max(.001,Math.abs(si)));const ix=W/2+co*rr,iy=H/2+si*rr;ctx.save();ctx.translate(ix,iy);ctx.rotate(a);ctx.beginPath();ctx.moveTo(11,0);ctx.lineTo(-8,-8);ctx.lineTo(-8,8);ctx.closePath();ctx.fillStyle=it.color;ctx.fill();ctx.rotate(-a);ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillStyle=it.color;ctx.fillText(it.label,0,-13);ctx.restore();}
   for(const e of enemies.active) {
    if(e.type!==3 || e.dead || visible(e.x,e.y,-20)) continue;
    const a=Math.atan2(e.y-camera.y,e.x-camera.x),cos=Math.cos(a),sin=Math.sin(a);
    const r=Math.min((W/2-35)/Math.max(.001,Math.abs(cos)),(H/2-45)/Math.max(.001,Math.abs(sin)));
    ctx.save();ctx.translate(W/2+cos*r,H/2+sin*r);ctx.rotate(a);
    ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(-7,-7);ctx.lineTo(-7,7);ctx.closePath();
    ctx.fillStyle="#ffdc82";ctx.fill();ctx.restore();
   }
  }
  if(touch.active && !touch.placing && state==="playing") {
   const x=touch.x/scale,y=touch.y/scale;
   circle(x,y,43,"#71f6ff09","#71f6ff44",2);
   circle(x+touch.dx*32,y+touch.dy*32,17,"#71f6ff33","#71f6ffaa",2);
  }
 }

 function frame(timestamp) {
  const dt=Math.min(.05,Math.max(0,(timestamp-(lastFrame || timestamp))/1000));
  lastFrame=timestamp;visualTime+=dt;
  toastTimer=Math.max(0,toastTimer-dt);
  if(!toastTimer) $("toast").style.opacity="0";
  saveClock+=dt;
  if(dirty && saveClock>=.6){save();saveClock=0;}
  if(state==="playing") {
   const steps=Math.max(1,Math.ceil(dt/(1/60)));
   for(let i=0;i<steps && state==="playing";i++) update(dt/steps);
   if(state==="playing") updateVisuals(dt);
   hudTimer+=dt;
   if(hudTimer>.08){hudTimer=0;updateHud();}
  } else if(state==="slot") updateSlot(dt);
  else if(["menu","over","victory","workshop"].includes(state)) updateVisuals(dt);
  draw();requestAnimationFrame(frame);
 }
 updateLoadout();mainMenu();requestAnimationFrame(frame);
})();
